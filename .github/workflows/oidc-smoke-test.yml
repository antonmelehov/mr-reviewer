name: OIDC smoke test

# Throwaway validation that the OIDC federated credential (ADR-002) is wired up
# correctly, before any real mr-trigger/diff-review logic is built on top of it.
# Delete this file once a real workflow supersedes it.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

jobs:
  verify-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Azure session
        run: az account show
