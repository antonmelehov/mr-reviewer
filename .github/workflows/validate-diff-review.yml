name: diff-review validation

# Throwaway validation that src/diff_review.py's review_diff works against
# the real deployed Foundry agent, matching diff-review.md's Definition of
# Done. Delete this file once superseded by the real composite-action
# workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: read

concurrency:
  group: diff-review-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-diff-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Review PR diff via src/diff_review.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.run_diff_review
